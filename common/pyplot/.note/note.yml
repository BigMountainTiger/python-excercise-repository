Install:
  1:
    tk: sudo apt install python3.11-tk
    note: |
      Need to install the version specific tk package, 
      e.g., python3.11-tk for Python 3.11, python3.14-tk for Python 3.14
  2:
    matplotlib: pip install matplotlib

Run: |
  import matplotlib
  import matplotlib.pyplot as plt

  matplotlib.use('TkAgg')

  plt.plot([1, 2, 3], [4, 5, 6])
  plt.title("X-Y")
  plt.xlabel("x")
  plt.ylabel("y")

  plt.show()